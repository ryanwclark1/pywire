[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "pywire"
version = "0.42.0"
description = "Python bindings for the Rust pgwire library: build PostgreSQL wire-protocol servers in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Clark" }]
requires-python = ">=3.11"
keywords = ["postgresql", "postgres", "pgwire", "wire-protocol", "asyncio", "server", "proxy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Database",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ryanwclark1/pywire"
Documentation = "https://ryanwclark1.github.io/pywire/"
Source = "https://github.com/ryanwclark1/pywire"
Changelog = "https://github.com/ryanwclark1/pywire/blob/main/CHANGELOG.md"
Issues = "https://github.com/ryanwclark1/pywire/issues"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "hypothesis",
  "ruff",
  "mypy",
  "pyright",
  "maturin>=1.8,<2.0",
  "psycopg[binary]",
]

[tool.maturin]
python-source = "."
module-name = "pywire._pywire"
features = ["pyo3/extension-module"]
include = [{ path = "pywire/py.typed", format = "wheel" }, { path = "pywire/_pywire/*.pyi", format = "wheel" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pywire --cov-report=term-missing --cov-report=xml:python-cov.xml"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["pywire"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  # Protocol / overload stub bodies.
  "^\\s*\\.\\.\\.$",
]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["target"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pywire", "tests", "scripts"]
exclude = "target/"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "hypothesis"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true

[tool.pyright]
include = ["pywire", "tests/typing"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
