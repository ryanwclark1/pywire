site_name: pywire
site_description: Python bindings for the Rust pgwire library
site_url: https://ryanwclark1.github.io/pywire/
repo_url: https://github.com/ryanwclark1/pywire
repo_name: ryanwclark1/pywire
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo-white.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: google

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Wire protocol concepts: concepts.md
  - User guide:
      - Simple queries: guides/simple-queries.md
      - Types and formats: guides/types-and-formats.md
      - Prepared statements: guides/extended-query.md
      - Per-connection sessions: guides/sessions.md
      - Streaming results: guides/streaming.md
      - COPY: guides/copy.md
      - Errors: guides/errors.md
      - Authentication: guides/authentication.md
      - TLS: guides/tls.md
      - Server lifecycle: guides/lifecycle.md
      - Wire messages: guides/messages.md
      - Testing your server: guides/testing.md
      - Typing: guides/typing.md
  - API reference:
      - Overview: api.md
      - Server: api/server.md
      - Query: api/query.md
      - Sessions: api/session.md
      - Types: api/types.md
      - COPY: api/copy.md
      - Auth: api/auth.md
      - Errors: api/errors.md
      - Messages: api/messages.md
      - Sync: api/sync.md
  - Versioning: versioning.md
  - Releasing: releasing.md
  - Contributing: contributing.md

strict: true
